name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Edge Functions to Supabase

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Prefer secret; fall back to known production project ref (not sensitive)
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            echo "Create a token at https://supabase.com/dashboard/account/tokens"
            echo "then add it under Settings → Secrets and variables → Actions"
            echo "(name must be SUPABASE_ACCESS_TOKEN — single underscore, not SUPABASE__ACCESS_TOKEN)."
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_PROJECT_REF secret not set; using production default."
            echo "SUPABASE_PROJECT_REF=noefayakyrmmknqlcklf" >> "$GITHUB_ENV"
          fi

          echo "Project ref ready"
          echo "Access token present"

      - name: Push database migrations
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD not set — skipping supabase db push."
            echo "Add the database password under Actions secrets to apply migrations from CI."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
          supabase db push --yes

      # Official CI pattern: deploy with --project-ref (no link required)
      - name: Deploy edge functions
        run: |
          for fn in \
            generate-article-insights \
            generate-action-suggestions \
            classify-note-impact \
            auto-publish-articles \
            delete-account
          do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Deployment Complete
        run: |
          echo "Edge Functions deployed to $SUPABASE_PROJECT_REF:"
          echo "  - generate-article-insights"
          echo "  - generate-action-suggestions"
          echo "  - classify-note-impact"
          echo "  - auto-publish-articles"
          echo "  - delete-account"
