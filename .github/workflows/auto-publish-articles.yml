name: Auto-Publish Scheduled Articles

# Runs near midnight America/Chicago (matches appTimezone + auto-publish edge function).
# 06:00 UTC ≈ midnight CST; 05:00 UTC ≈ midnight CDT. Dual cron covers both.
on:
  schedule:
    - cron: '5 6 * * *'
    - cron: '5 5 * * *'
  workflow_dispatch:

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    name: Trigger Auto-Publish Edge Function

    steps:
      - name: Get current date (America/Chicago)
        id: date
        run: |
          APP_DATE=$(TZ=America/Chicago date +"%Y-%m-%d %H:%M %Z")
          echo "app_date=$APP_DATE" >> $GITHUB_OUTPUT
          echo "Running auto-publish for: $APP_DATE"

      - name: Call Supabase Edge Function
        run: |
          echo "Calling auto-publish Edge Function..."

          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ] || [ -z "${{ secrets.AUTO_PUBLISH_SECRET }}" ]; then
            echo "Missing required GitHub secrets: SUPABASE_URL, SUPABASE_ANON_KEY, and/or AUTO_PUBLISH_SECRET"
            exit 1
          fi

          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/auto-publish-articles" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-cron-secret: ${{ secrets.AUTO_PUBLISH_SECRET }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response:"
          echo "$body" | jq '.' || echo "$body"

          if [ "$http_code" = "200" ]; then
            echo "Auto-publish completed successfully!"
          else
            echo "Auto-publish failed with status $http_code"
            exit 1
          fi

      - name: Report Results
        if: always()
        run: |
          echo "Auto-Publish Report"
          echo "Date: ${{ steps.date.outputs.app_date }}"
          echo "Status: ${{ job.status }}"
